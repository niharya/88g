# Netlify project configuration.
# Keeps build settings version-controlled so a repo relink / rename can't
# drift them. Values here win over the Netlify dashboard UI.

[build]
  command  = "npm run build"
  publish  = ".next"

[build.environment]
  # Pin Node to match local (node --version → v22). Keeps CI builds reproducible.
  NODE_VERSION = "22"
  # Umami website id. Public (it appears in the page HTML), kept here so analytics
  # can be repointed or disabled without a code change. Read by app/Analytics.tsx.
  NEXT_PUBLIC_UMAMI_ID = "07cb233d-26f2-4dbb-98c8-546cf12d602f"

# Security headers.
#
# SCOPE — this block covers only what Netlify serves straight from the CDN:
# the static files under public/, the resume PDF among them. It does NOT reach
# responses generated by the Next runtime, which is every actual page. Those
# are covered by the matching list in next.config.mjs, which is the SOURCE OF
# TRUTH — keep the two identical, and add new values there first.
#
# Order:
#   • HSTS — force HTTPS for 2y once seen, include subdomains, allow preload list.
#   • X-Frame-Options SAMEORIGIN — no embedding by *other* origins. It must not
#     be DENY: DENY forbids framing even by our own pages, and /resume renders
#     the PDF in a same-origin iframe (app/resume/page.tsx). Under DENY the
#     browser refuses to paint that frame and /resume reads as a blank page —
#     a bug that only appears in production, since `next dev` never serves
#     these headers. Pairs with frame-ancestors 'self' in the CSP below for
#     clients that prefer CSP.
#   • X-Content-Type-Options nosniff — browsers must respect declared MIME types.
#   • Referrer-Policy — leak full URL same-origin only; cross-origin is just origin.
#   • Permissions-Policy — disable powerful sensors / autoplay capabilities the
#     site never uses, so an XSS can't request them.
#   • Content-Security-Policy-Report-Only — observation phase. Once we've watched
#     report-uri logs and no legitimate traffic is blocked, promote to enforcing
#     Content-Security-Policy by renaming this header. The current policy keeps
#     allowances for emailjs (contact form), the Google Calendar embed
#     (book-a-call), the same-origin PDF frame on /resume (frame-src 'self'),
#     and Umami analytics (script from cloud.umami.is in
#     script-src; beacons to gateway.umami.is in connect-src). Umami is sent
#     DIRECT, not proxied: it geolocates from the request IP, so a same-origin
#     proxy would hide every visitor's real IP and report them all as the proxy
#     server's region. Google Fonts allowances were removed once /rr's decorative
#     fonts moved to next/font/local.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.emailjs.com https://cloud.umami.is; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.emailjs.com https://gateway.umami.is; frame-src 'self' https://calendar.app.google https://niharbhagat.notion.site https://embed.figma.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; report-uri /csp-report"
