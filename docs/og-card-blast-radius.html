<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2f3ef; --ink:#141414; --terra:#A16803;
    --grid-line:rgba(140,110,45,.11);
    --sans:"Archivo",system-ui,sans-serif;
    --mono:"Spline Sans Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background-color:var(--paper);
    background-image:
      linear-gradient(to right,var(--grid-line) 1px,transparent 1px),
      linear-gradient(to bottom,var(--grid-line) 1px,transparent 1px);
    background-size:32px 32px,32px 32px;
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;
  }
  .card{
    position:absolute; left:72px; right:72px; top:72px; bottom:90px;
    border:2px solid var(--ink);
    background:rgba(255,255,255,.72);
    display:flex; flex-direction:column; justify-content:flex-start;
    padding:77px 74px 0;
  }
  .brand{
    display:flex; align-items:center; gap:30px;
    font-size:99px; line-height:1;
    font-variation-settings:"wdth" 112,"wght" 680;
    letter-spacing:-.025em; color:var(--ink);
  }
  .rings{width:60px;height:60px;flex:none;color:var(--ink)}
  .rings .core{fill:var(--terra)}
  .sub{
    margin-top:36px; font-size:43px; line-height:1.22;
    font-variation-settings:"wdth" 100,"wght" 450;
    letter-spacing:-.015em; color:var(--ink); max-width:14ch;
  }
  .foot{margin-top:38px; display:flex; align-items:center; gap:26px}
  .domain{
    background:var(--ink); color:#fff; font-size:26px;
    font-variation-settings:"wdth" 108,"wght" 680;
    letter-spacing:-.01em; padding:9px 24px;
  }
  .note{font-family:var(--mono); font-size:25px; font-weight:500; color:var(--terra); letter-spacing:.01em}
</style></head><body>
  <div class="card">
    <div class="brand">
      <svg class="rings" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".22"/>
        <circle cx="20" cy="20" r="13" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".4"/>
        <circle cx="20" cy="20" r="7.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".7"/>
        <circle class="core" cx="20" cy="20" r="3.4"/>
      </svg>
      Blast Radius
    </div>
    <p class="sub">A sandbox for notification policy</p>
    <div class="foot">
      <span class="domain">nihar.works</span>
      <span class="note">working sketch</span>
    </div>
  </div>
</body></html>
